name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install fastapi httpx uvicorn[standard]

      - name: Run full test suite (including serving tests)
        run: python -m unittest discover -s tests -v

      - name: Run offline CI pipeline
        run: python run_inside_airbnb_pipeline.py ci --manifest reports/ci_reproducibility_manifest.json

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence
          path: |
            reports/inside_airbnb/pipeline_run.json
            reports/ci_reproducibility_manifest.json
          if-no-files-found: warn

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t airbnb-predictor .

      - name: Run container with CI fixture artifact
        run: |
          docker run -d --name predictor \
            -v $PWD/tests/fixtures:/models \
            -e MODEL_ARTIFACT_PATH=/models/minimal_artifact.joblib \
            -p 8000:8000 \
            airbnb-predictor

      - name: Wait for readiness
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Health check
        run: |
          curl -s http://localhost:8000/health | python -c "
          import json, sys; d = json.load(sys.stdin)
          assert d['status'] == 'healthy', f'Expected healthy, got {d}'
          assert d['artifact_loaded'] == True
          assert d['snapshot_label'] == 'ci-fixture'
          print('Health OK')
          "

      - name: Model info check
        run: |
          curl -s http://localhost:8000/model-info | python -c "
          import json, sys; d = json.load(sys.stdin)
          assert d['snapshot_label'] == 'ci-fixture'
          assert d['model_family'] != ''
          assert len(d['features']['numeric']) > 0
          print('Model-info OK')
          "

      - name: Predict smoke test
        run: |
          curl -s -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"as_of_date":"2026-07-28","quote_checkin_date":"2026-08-15","quote_checkout_date":"2026-08-17","neighbourhood":"Sydney","property_type":"Entire rental unit","room_type":"Entire home/apt","latitude":-33.8688,"longitude":151.2093,"accommodates":2,"bathrooms":1,"bedrooms":1,"beds":1,"amenities_count":30,"minimum_nights":1,"maximum_nights":365,"calculated_host_listings_count":1,"host_is_superhost":"f"}' \
            | python -c "
          import json, sys; d = json.load(sys.stdin)
          assert d['currency'] == 'AUD'
          assert d['snapshot_label'] == 'ci-fixture'
          assert d['evidence_tier'] in ('HIGH','MEDIUM','LOW','REFUSE')
          print(f'Predict OK — price {d.get(\"estimated_price\",\"refused\")} — tier {d[\"evidence_tier\"]}')
          "

      - name: Monitoring check
        run: |
          curl -s http://localhost:8000/monitoring | python -c "
          import json, sys; d = json.load(sys.stdin)
          assert d['report_version'] == 1
          assert d['summary']['healthy'] + d['summary']['warning'] + d['summary']['critical'] + d['summary']['not_available'] == len(d['signals'])
          print(f'Monitoring OK — {d[\"summary\"]}')
          "

      - name: Cleanup
        if: always()
        run: docker rm -f predictor || true
