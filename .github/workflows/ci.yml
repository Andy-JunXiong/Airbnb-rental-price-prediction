name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline CI pipeline
        run: python run_inside_airbnb_pipeline.py ci --manifest reports/ci_reproducibility_manifest.json

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence
          path: |
            reports/inside_airbnb/pipeline_run.json
            reports/ci_reproducibility_manifest.json
          if-no-files-found: warn
