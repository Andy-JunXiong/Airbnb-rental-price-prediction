[project]
name = "airbnb-rental-price-prediction"
version = "0.1.0"
description = "Airbnb Sydney public quote-price research pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "lightgbm>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
ui = [
    "streamlit>=1.40",
]
text = [
    "sentence-transformers>=3.0",
]
llm = [
    "openai>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
