[project]
name = "airbnb-rental-price-prediction"
version = "0.1.0"
description = "Airbnb Sydney public quote-price research pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "lightgbm>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
